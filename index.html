
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Verification</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1020; color: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(90%, 400px); padding: 32px 24px; text-align: center;
      background: #151c30; border: 1px solid #303b55; border-radius: 18px;
    }
    .spinner {
      width: 48px; height: 48px; margin: 0 auto 22px;
      border: 4px solid #334155; border-top-color: #60a5fa;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    .track { height: 6px; margin-top: 24px; background: #303b55; border-radius: 9px; overflow: hidden; }
    .progress { height: 100%; width: 0; background: #60a5fa; animation: load 5s linear forwards; }
    p { color: #cbd5e1; line-height: 1.5; }
    small { color: #94a3b8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes load { to { width: 100%; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner"></div>
    <h2>Security Check</h2>
    <p id="status">Please wait while we process your visit...</p>
    <div class="track"><div class="progress"></div></div>
    <p><small>
      Cybersecurity demo: visit time, browser information, timezone
      and network IP are recorded for security investigation.
    </small></p>
  </main>

  <script>
    async function reportVisit() {
      try {
        await fetch("/api/visit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            userAgent: navigator.userAgent,
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            screen: `${screen.width}x${screen.height}`,
            platform: navigator.platform
          })
        });
      } catch (error) {
        console.error("Report failed:", error);
      }
    }

    reportVisit();

    setTimeout(() => {
      document.getElementById("status").textContent =
        "Check complete. Redirecting...";
      window.location.replace("https://www.google.com/");
    }, 5000);
  </script>
</body>
</html>
